[package]
name = "ssd-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ssd-rom = { path = "../ssd-rom" }
ssd-oracle = { path = "../ssd-oracle" }
ssd-catalogue = { workspace = true }
ssd-hd = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
bytemuck = { workspace = true }
wasm-bindgen = "0.2"

[lints]
workspace = true

# Enable secure browser JS randomness for the transitive SNES core dependencies.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
