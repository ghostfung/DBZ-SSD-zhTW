<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#10121a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>DBZ SSD · iPhone Web POC</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <main>
    <h1>超賽亞傳說 <small>iPhone 網頁原型</small></h1>
    <p class="notice">第三階段試驗：RC1 中文對話直接畫進原版視窗，及原作者的 Enhanced 2x 畫面。尚未加入完整 HD 美術素材包、HD 選單與 16:9 畫面。</p>
    <section id="setup">
      <label>選擇自己的 SNES ROM（.sfc／.smc）<input id="rom" type="file" accept=".sfc,.smc,.bin,application/octet-stream"/></label>
      <label>日文 Rev 1 需要 IPS（.ips）<input id="ips" type="file" accept=".ips,application/octet-stream"/></label>
      <button id="start" disabled>啟動本機遊戲</button>
      <output id="status" aria-live="polite">等待載入。</output>
    </section>
    <section id="game" hidden>
      <div class="screen"><canvas id="screen" width="256" height="224"></canvas></div>
      <div class="stats"><span id="frames">0 幀</span><span id="fps"></span></div>
      <div class="preview-bar">
        <label class="check-option"><input id="inframe" type="checkbox" checked/> 中文顯示於遊戲內</label>
        <button id="hd-toggle" type="button">啟用 HD 2x</button>
        <span id="hd-info" aria-live="polite">Classic 原版畫面</span>
      </div>
      <div id="translation-card" class="translation-card" hidden>
        <div class="translation-heading"><strong>無法內嵌時的繁中字幕</strong><span id="translation-key"></span></div>
        <div id="translation-text" class="translation-text" lang="zh-Hant-TW"></div>
      </div>
      <p id="translation-count" class="translation-count" aria-live="polite"></p>
      <div class="controls">
        <div class="dpad">
          <button data-bit="4" class="up" aria-label="上">▲</button>
          <button data-bit="6" class="left" aria-label="左">◀</button>
          <button data-bit="7" class="right" aria-label="右">▶</button>
          <button data-bit="5" class="down" aria-label="下">▼</button>
        </div>
        <div class="actions">
          <button data-bit="9">X</button><button data-bit="1">Y</button>
          <button data-bit="8">A</button><button data-bit="0">B</button>
        </div>
      </div>
      <div class="utility">
        <button data-bit="2">Select</button><button data-bit="3">Start</button>
        <button id="save">匯出即時存檔</button>
        <label class="upload">匯入存檔<input id="state-file" type="file" accept=".sav,.bin"/></label>
        <button id="sound" type="button">啟用聲音</button><button id="stop">停止</button>
      </div>
      <p id="sound-status" class="audio-status" aria-live="polite">啟動時嘗試開啟聲音；如無聲請按「啟用聲音」。</p>
    </section>
    <p class="footer">ROM、IPS、存檔只在本機處理，不上傳伺服器。

      繁體中文譯文 © 2026 <a href="https://github.com/lming888/DBZ-SSD-zhTW" rel="noopener noreferrer" target="_blank">Ming / DBZ-SSD-zhTW</a> · CC BY-NC-SA 4.0。
      </p>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
