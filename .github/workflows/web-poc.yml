name: DBZ iPhone Web POC (WASM)

on:
  push:
    branches: [iphone-web-poc]
    paths:
      - 'crates/ssd-web/**'
      - 'crates/ssd-hd/**'
      - 'crates/ssd-oracle/**'
      - 'crates/ssd-game/**'
      - 'crates/ssd-rom/**'
      - 'web/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/web-poc.yml'
  pull_request:
    paths:
      - 'crates/ssd-web/**'
      - 'crates/ssd-hd/**'
      - 'crates/ssd-oracle/**'
      - 'crates/ssd-game/**'
      - 'crates/ssd-rom/**'
      - 'web/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/web-poc.yml'
  workflow_dispatch:

# Prevent simultaneous push builds from publishing stale browser binaries.
concurrency:
  group: dbz-web-poc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Only this isolated test branch publishes wasm output; it never writes to main.
  contents: write

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - name: Verify active Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target list --installed
          rustc --version
      - name: Test JavaScript and ROM checks
        run: node --test tests/*.test.mjs
      - name: Verify browser JavaScript syntax
        run: node --check web/app.mjs && node --check web/chinese-overlay.mjs && node --check web/hd-pack.mjs && node --check web/hd-import-ui.mjs && node --check web/sha256-stream.mjs && node --check web/hd-storage.mjs && node --check web/hd-local-assets.mjs && node --check web/hd-background-index.mjs && node --check web/hd-live.mjs && node --check web/screen-text.mjs
      - name: Check web bridge, including SNES core (WASM)
        run: cargo check -p ssd-web --target wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build browser wasm
        run: wasm-pack build crates/ssd-web --target web --out-dir ../../web/pkg --release
      - name: Publish compiled browser package to isolated test branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/iphone-web-poc'
        run: |
          set -euo pipefail
          test -s web/pkg/ssd_web_bg.wasm
          test -s web/pkg/ssd_web.js
          test -s translations/zh-tw/zh-tw.tsv
          cp translations/zh-tw/zh-tw.tsv web/zh-tw.tsv
          test -s web/zh-tw.tsv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another edit may have landed while wasm was compiling; never publish an older build.
          git fetch --no-tags origin iphone-web-poc
          latest="$(git rev-parse FETCH_HEAD)"
          if [ "$GITHUB_SHA" != "$latest" ]; then
            echo "Newer source commit found ($latest); skip stale package publishing."
            exit 0
          fi
          # Only generated browser runtime: ROMs, patches and HD packs must never be published.
          git add -f web/pkg/ web/zh-tw.tsv
          if git diff --cached --quiet; then
            echo 'WASM package unchanged; no commit needed.'
          else
            git commit -m "build(web-poc): publish tested WASM runtime [skip ci]"
            git push origin HEAD:iphone-web-poc
          fi
      - name: Upload playable-test shell (no ROM, no IPS, no HD assets)
        uses: actions/upload-artifact@v4
        with:
          name: dbz-ssd-web-poc
          path: web/
          retention-days: 7
