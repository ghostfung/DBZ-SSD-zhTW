name: DBZ iPhone Web POC (WASM)

on:
  push:
    branches: [iphone-web-poc, iphone-hd-integration-batch, feature-classic-zh-lite, feature-phase1-cheats, feature-cheats-persistence, feature-hd-fighter-diagnostics, feature-hd-fighter-multimatch, feature-hd-goku-identity-v52, feature-hd-goku-candidates-v53, feature-local-save-slots-v54, feature-hd-fast-restore-v55, feature-speed-toggle-v56, fix-namek-eight-portraits-v58, feature-offline-first-v59, feature-offline-auto-update-v60]
    paths:
      - 'crates/ssd-web/**'
      - 'crates/ssd-hd/**'
      - 'crates/ssd-catalogue/**'
      - 'crates/ssd-oracle/**'
      - 'crates/ssd-game/**'
      - 'crates/ssd-rom/**'
      - 'web/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/web-poc.yml'
  pull_request:
    paths:
      - 'crates/ssd-web/**'
      - 'crates/ssd-hd/**'
      - 'crates/ssd-catalogue/**'
      - 'crates/ssd-oracle/**'
      - 'crates/ssd-game/**'
      - 'crates/ssd-rom/**'
      - 'web/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/web-poc.yml'
  workflow_dispatch:

# Prevent simultaneous push builds from publishing stale browser binaries.
concurrency:
  group: dbz-web-poc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Only this isolated test branch publishes wasm output; it never writes to main.
  contents: write

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - name: Verify active Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target list --installed
          rustc --version
      - name: Test JavaScript and ROM checks
        run: |
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/dbz-node.log"
      - name: Verify browser JavaScript syntax
        run: node --check web/app.mjs && node --check web/offline-installer.mjs && node --check web/service-worker.js && node --check web/speed-control.mjs && node --check web/save-slots.mjs && node --check web/story-frame-gate.mjs && node --check web/hd-frame-gate.mjs && node --check web/chinese-overlay.mjs && node --check web/hd-pack.mjs && node --check web/hd-import-ui.mjs && node --check web/sha256-stream.mjs && node --check web/hd-storage.mjs && node --check web/hd-local-assets.mjs && node --check web/hd-background-index.mjs && node --check web/hd-coverage-audit.mjs && node --check web/hd-coverage-runtime.mjs && node --check web/hd-fighter-diagnostic.mjs && node --check web/hd-live.mjs && node --check web/hd-fighter-live.mjs && node --check web/hd-portrait-index.mjs && node --check web/hd-portrait-live.mjs && node --check web/hd-portrait-gate.mjs && node --check web/hd-special-index.mjs && node --check web/hd-special-live.mjs && node --check web/hd-map-index.mjs && node --check web/hd-map-live.mjs && node --check web/hd-card-index.mjs && node --check web/hd-card-live.mjs && node --check web/hd-mode7-index.mjs && node --check web/hd-mode7-live.mjs && node --check web/frame-metrics.mjs && node --check web/hd-map-prefetch.mjs && node --check web/hd-phase-report.mjs && node --check web/transition-artifact-gate.mjs && node --check web/screen-text.mjs
      - name: Test browser bridge's native OAM pose and alpha-mask rules
        run: |
          set -o pipefail
          cargo test -p ssd-web --lib 2>&1 | tee "$RUNNER_TEMP/dbz-rust.log"
      - name: Check web bridge, including SNES core (WASM)
        run: |
          set -o pipefail
          cargo check -p ssd-web --target wasm32-unknown-unknown 2>&1 | tee "$RUNNER_TEMP/dbz-wasm-check.log"
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build browser wasm
        run: |
          set -o pipefail
          wasm-pack build crates/ssd-web --target web --out-dir ../../web/pkg --release 2>&1 | tee "$RUNNER_TEMP/dbz-wasm-pack.log"
      - name: Publish bounded diagnostics if browser build fails
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/iphone-web-poc'
        run: |
          set -euo pipefail
          git fetch --no-tags origin iphone-web-poc
          if [ "$GITHUB_SHA" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Source moved; skip stale diagnostic commit."
            exit 0
          fi
          {
            echo "iPhone web build failed at source $GITHUB_SHA"
            echo "Only compiler/test output (no ROM, HD assets or credentials)."
            for log in dbz-node.log dbz-rust.log dbz-wasm-check.log dbz-wasm-pack.log; do
              if test -f "$RUNNER_TEMP/$log"; then
                echo "===== $log ====="
                if [ "$log" = dbz-node.log ]; then
                  tail -n 130 "$RUNNER_TEMP/$log"
                else
                  grep -E -A 5 '^(error|Error:|FAIL|not ok|[[:space:]]+-->)' "$RUNNER_TEMP/$log" | tail -n 90 || true
                fi
              fi
            done
          } > web/ci-portrait-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/ci-portrait-failure.txt
          git commit -m "ci(iphone): record failed portrait build [skip ci]"
          git push origin HEAD:iphone-web-poc
      - name: Publish compiled browser package to isolated test branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/iphone-web-poc' || github.ref == 'refs/heads/iphone-hd-integration-batch' || github.ref == 'refs/heads/feature-classic-zh-lite' || github.ref == 'refs/heads/feature-phase1-cheats' || github.ref == 'refs/heads/feature-cheats-persistence' || github.ref == 'refs/heads/feature-hd-fighter-diagnostics' || github.ref == 'refs/heads/feature-hd-fighter-multimatch' || github.ref == 'refs/heads/feature-hd-goku-identity-v52' || github.ref == 'refs/heads/feature-hd-goku-candidates-v53' || github.ref == 'refs/heads/feature-local-save-slots-v54' || github.ref == 'refs/heads/feature-hd-fast-restore-v55' || github.ref == 'refs/heads/feature-speed-toggle-v56' || github.ref == 'refs/heads/fix-namek-eight-portraits-v58' || github.ref == 'refs/heads/feature-offline-first-v59' || github.ref == 'refs/heads/feature-offline-auto-update-v60')
        run: |
          set -euo pipefail
          test -s web/pkg/ssd_web_bg.wasm
          test -s web/pkg/ssd_web.js
          test -s translations/zh-tw/zh-tw.tsv
          cp translations/zh-tw/zh-tw.tsv web/zh-tw.tsv
          test -s web/zh-tw.tsv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another edit may have landed while wasm was compiling; never publish an older build.
          test "$GITHUB_REF_NAME" = 'iphone-web-poc' || test "$GITHUB_REF_NAME" = 'iphone-hd-integration-batch' || test "$GITHUB_REF_NAME" = 'feature-classic-zh-lite' || test "$GITHUB_REF_NAME" = 'feature-phase1-cheats' || test "$GITHUB_REF_NAME" = 'feature-cheats-persistence' || test "$GITHUB_REF_NAME" = 'feature-hd-fighter-diagnostics' || test "$GITHUB_REF_NAME" = 'feature-hd-fighter-multimatch' || test "$GITHUB_REF_NAME" = 'feature-hd-goku-identity-v52' || test "$GITHUB_REF_NAME" = 'feature-hd-goku-candidates-v53' || test "$GITHUB_REF_NAME" = 'feature-local-save-slots-v54' || test "$GITHUB_REF_NAME" = 'feature-hd-fast-restore-v55' || test "$GITHUB_REF_NAME" = 'feature-speed-toggle-v56' || test "$GITHUB_REF_NAME" = 'fix-namek-eight-portraits-v58' || test "$GITHUB_REF_NAME" = 'feature-offline-first-v59' || test "$GITHUB_REF_NAME" = 'feature-offline-auto-update-v60'
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          latest="$(git rev-parse FETCH_HEAD)"
          if [ "$GITHUB_SHA" != "$latest" ]; then
            echo "Newer source commit found ($latest); skip stale package publishing."
            exit 0
          fi
          # Only generated browser runtime: ROMs, patches and HD packs must never be published.
          git add -f web/pkg/ web/zh-tw.tsv
          if git diff --cached --quiet; then
            echo 'WASM package unchanged; no commit needed.'
          else
            git commit -m "build(web-poc): publish tested WASM runtime [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload playable-test shell (no ROM, no IPS, no HD assets)
        uses: actions/upload-artifact@v4
        with:
          name: dbz-ssd-web-poc
          path: web/
          retention-days: 7
