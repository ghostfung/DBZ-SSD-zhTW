name: Build and publish isolated widescreen preview v70
on:
  push:
    branches: [feature-widescreen-v70]
  workflow_dispatch:
concurrency:
  group: widescreen-v70-preview
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check core and preview composition
        run: |
          cargo test -p ssd-web --lib
          cargo check -p ssd-web --target wasm32-unknown-unknown
      - name: Build WASM
        run: |
          cargo install wasm-pack --locked
          wasm-pack build crates/ssd-web --target web --out-dir ../../web/pkg --release
      - name: Reconcile offline manifest and check build identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const releasePath='web/offline-release.json',installerPath='web/offline-installer.mjs';
          const release=JSON.parse(fs.readFileSync(releasePath,'utf8'));
          if(release.version!=='v70')throw Error('unexpected release');
          release.wasmSize=fs.statSync('web/pkg/ssd_web_bg.wasm').size;
          if(release.wasmSize>25*1024*1024)throw Error('Cloudflare asset limit exceeded');
          const glue=fs.readFileSync('web/pkg/ssd_web.js','utf8');
          if(!glue.includes('set_widescreen('))throw Error('missing widescreen WASM binding');
          const snippets=[...glue.matchAll(/from ["']\.\/(snippets\/[^"']+)["']/g)].map(m=>'pkg/'+m[1]);
          for(const s of snippets)if(!fs.existsSync('web/'+s))throw Error('missing '+s);
          release.files=release.files.filter(f=>!f.startsWith('pkg/snippets/'));
          release.files.splice(release.files.indexOf('pkg/ssd_web.js'),0,...new Set(snippets));
          fs.writeFileSync(releasePath,JSON.stringify(release,null,2)+'\n');
          let installer=fs.readFileSync(installerPath,'utf8');
          installer=installer.replace(/OFFLINE_WASM_SIZE=\d+;/,'OFFLINE_WASM_SIZE='+release.wasmSize+';')
            .replace(/OFFLINE_FILES=Object\.freeze\(\[[^\n]*\]\);/,'OFFLINE_FILES=Object.freeze('+JSON.stringify(release.files)+');');
          fs.writeFileSync(installerPath,installer);
          NODE
      - name: Frontend regression tests
        run: |
          node --check web/app.mjs
          node --check web/offline-installer.mjs
          node --check web/service-worker.js
          node --test tests/audio.test.mjs tests/speed-control.test.mjs tests/v68-tablet-input.test.mjs tests/cloudflare-migration.test.mjs tests/v63-thumbnail-backup.test.mjs
      - name: Publish only to preview branch (never production)
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feature-widescreen-v70
          git fetch --no-tags origin feature-widescreen-v70 preview
          test "$GITHUB_SHA" = "$(git rev-parse origin/feature-widescreen-v70)"
          test "$(git rev-parse origin/preview)" = "5ad35f1f957b5fb29efc95418ca9dcd64416ee72"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/pkg web/offline-release.json web/offline-installer.mjs
          git diff --cached --quiet || git commit -m "build(v70): verified widescreen preview runtime"
          git merge-base --is-ancestor origin/preview HEAD
          git push origin HEAD:preview
